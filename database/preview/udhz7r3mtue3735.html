<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
* {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 -webkit-tap-highlight-color: transparent;
}

body {
 min-height: 100vh;
 display: flex;
 align-items: center;
 justify-content: center;
 background: #0b0b0f;
 font-family: Arial, Helvetica, sans-serif;
 color: #fff;
}

.calculator {
 width: min(100%, 390px);
 padding: 20px;
}

.display {
 min-height: 150px;
 padding: 25px 20px;
 display: flex;
 flex-direction: column;
 justify-content: flex-end;
 align-items: flex-end;
 overflow: hidden;
 border-radius: 28px;
 background: #15151b;
 border: 1px solid #24242d;
 margin-bottom: 15px;
}

.previous {
 width: 100%;
 min-height: 28px;
 text-align: right;
 color: #777783;
 font-size: 18px;
 overflow-x: auto;
 white-space: nowrap;
}

.current {
 width: 100%;
 text-align: right;
 font-size: 46px;
 font-weight: 500;
 overflow-x: auto;
 white-space: nowrap;
 scrollbar-width: none;
}

.current::-webkit-scrollbar,
.previous::-webkit-scrollbar {
 display: none;
}

.buttons {
 display: grid;
 grid-template-columns: repeat(4, 1fr);
 gap: 11px;
}

button {
 height: 72px;
 border: 0;
 border-radius: 22px;
 background: #19191f;
 color: #fff;
 font-size: 23px;
 font-weight: 500;
 cursor: pointer;
 transition: transform .08s, filter .15s;
 user-select: none;
}

button:active {
 transform: scale(.94);
 filter: brightness(1.3);
}

.operator {
 background: #22222a;
}

.action {
 background: #303039;
}

.equal {
 background: #fff;
 color: #0b0b0f;
}

.zero {
 grid-column: span 2;
}

@media (max-width: 360px) {
 .calculator {
 padding: 14px;
 }

 button {
 height: 64px;
 border-radius: 19px;
 font-size: 21px;
 }

 .current {
 font-size: 39px;
 }

 .display {
 min-height: 135px;
 }
}
</style>
</head>

<body>

<div class="calculator">

 <div class="display">
 <div class="previous" id="previous"></div>
 <div class="current" id="current">0</div>
 </div>

 <div class="buttons">
 <button class="action" onclick="clearCalculator()">AC</button>
 <button class="action" onclick="deleteNumber()">⌫</button>
 <button class="action" onclick="percentage()">%</button>
 <button class="operator" onclick="chooseOperator('÷')">÷</button>

 <button onclick="appendNumber('7')">7</button>
 <button onclick="appendNumber('8')">8</button>
 <button onclick="appendNumber('9')">9</button>
 <button class="operator" onclick="chooseOperator('×')">×</button>

 <button onclick="appendNumber('4')">4</button>
 <button onclick="appendNumber('5')">5</button>
 <button onclick="appendNumber('6')">6</button>
 <button class="operator" onclick="chooseOperator('−')">−</button>

 <button onclick="appendNumber('1')">1</button>
 <button onclick="appendNumber('2')">2</button>
 <button onclick="appendNumber('3')">3</button>
 <button class="operator" onclick="chooseOperator('+')">+</button>

 <button class="zero" onclick="appendNumber('0')">0</button>
 <button onclick="appendDecimal()">.</button>
 <button class="equal" onclick="calculate()">=</button>
 </div>

</div>

<script>
let current = '0'
let previous = ''
let operator = null
let shouldReset = false

const currentDisplay = document.getElementById('current')
const previousDisplay = document.getElementById('previous')

function updateDisplay() {
 currentDisplay.textContent = formatNumber(current)
 previousDisplay.textContent = previous
 ? `${formatNumber(previous)} ${operator || ''}`
 : ''
}

function formatNumber(value) {
 if (value === 'Error') return value

 const parts = value.split('.')

 let number = parts[0]

 if (number.startsWith('-')) {
 const negative = '-'
 number = number.slice(1)

 number = number.replace(/\B(?=(\d{3})+(?!\d))/g, ',')

 return negative + number + (parts[1] !== undefined ? '.' + parts[1] : '')
 }

 number = number.replace(/\B(?=(\d{3})+(?!\d))/g, ',')

 return number + (parts[1] !== undefined ? '.' + parts[1] : '')
}

function appendNumber(number) {
 if (current === 'Error' || shouldReset) {
 current = number
 shouldReset = false
 } else {
 if (current === '0') {
 current = number
 } else {
 current += number
 }
 }

 updateDisplay()
}

function appendDecimal() {
 if (current === 'Error' || shouldReset) {
 current = '0.'
 shouldReset = false
 } else if (!current.includes('.')) {
 current += '.'
 }

 updateDisplay()
}

function chooseOperator(selectedOperator) {
 if (current === 'Error') return

 if (operator && !shouldReset) {
 calculate()
 }

 previous = current
 operator = selectedOperator
 shouldReset = true

 updateDisplay()
}

function calculate() {
 if (!operator || previous === '' || current === 'Error') return

 const a = parseFloat(previous)
 const b = parseFloat(current)

 let result

 switch (operator) {
 case '+':
 result = a + b
 break

 case '−':
 result = a - b
 break

 case '×':
 result = a * b
 break

 case '÷':
 if (b === 0) {
 current = 'Error'
 previous = ''
 operator = null
 updateDisplay()
 return
 }

 result = a / b
 break
 }

 if (!Number.isFinite(result)) {
 current = 'Error'
 } else {
 current = String(Number(result.toPrecision(12)))
 }

 previous = ''
 operator = null
 shouldReset = true

 updateDisplay()
}

function clearCalculator() {
 current = '0'
 previous = ''
 operator = null
 shouldReset = false

 updateDisplay()
}

function deleteNumber() {
 if (current === 'Error' || shouldReset) {
 current = '0'
 shouldReset = false
 } else if (current.length > 1) {
 current = current.slice(0, -1)

 if (current === '-') {
 current = '0'
 }
 } else {
 current = '0'
 }

 updateDisplay()
}

function percentage() {
 if (current === 'Error') return

 const value = parseFloat(current)

 if (!Number.isFinite(value)) return

 current = String(value / 100)

 updateDisplay()
}

document.addEventListener('keydown', event => {
 const key = event.key

 if (/^[0-9]$/.test(key)) {
 appendNumber(key)
 return
 }

 if (key === '.') {
 appendDecimal()
 return
 }

 if (key === '+') {
 chooseOperator('+')
 return
 }

 if (key === '-') {
 chooseOperator('−')
 return
 }

 if (key === '*') {
 chooseOperator('×')
 return
 }

 if (key === '/') {
 event.preventDefault()
 chooseOperator('÷')
 return
 }

 if (key === '%') {
 percentage()
 return
 }

 if (key === 'Enter' || key === '=') {
 calculate()
 return
 }

 if (key === 'Backspace') {
 deleteNumber()
 return
 }

 if (key === 'Escape') {
 clearCalculator()
 }
})

updateDisplay()
</script>

</body>
</html>
